name: Publish to drayspo.com

# Manual only: builds main and deploys it to GitHub Pages (custom domain drayspo.com).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the site has been synced
        run: |
          [ -f package.json ] || { echo "::error::No site code on main yet. Run 'Sync from upstream' first"; exit 1; }

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install

      - name: Test
        run: bun run test

      - name: Build
        run: |
          bun run build
          test -f dist/client/index.html
          cp dist/client/index.html dist/client/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
